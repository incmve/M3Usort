name: Docker Image CI (rust)
on:
  push:
    branches: [ "rust" ]
    tags: [ "rust-v*" ]
  pull_request:
    branches: [ "rust" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/rust-v')
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG_VERSION="${GITHUB_REF_NAME#rust-v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/rust-v* ]]; then
            V="${GITHUB_REF_NAME#rust-v}"
            echo "tags=incmve/m3usort:rust,incmve/m3usort:rust-$V" >> "$GITHUB_OUTPUT"
          else
            echo "tags=incmve/m3usort:rust" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to dockerhub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: M3USORT_GIT_SHA=${{ github.sha }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          # rust-v0.2.0-beta.1 -> pre-release
          if [[ "${GITHUB_REF_NAME#rust-v}" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "M3Usort (Rust) ${GITHUB_REF_NAME#rust-v}" \
            --generate-notes --latest=false $PRE
