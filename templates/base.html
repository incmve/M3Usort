<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }}</title>
<style>
:root{--bg:#16181d;--panel:#1e2128;--line:#2d313b;--text:#e6e6e6;--muted:#9aa0aa;--accent:#7cc4ff;--ok:#3d7a4a;--okbg:#1f3a24;--err:#a34848;--errbg:#3a1f1f}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.5}
header{display:flex;align-items:center;gap:1rem;padding:.7rem 1.2rem;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;color:var(--accent);text-decoration:none;margin-right:auto}
header a,header button{color:var(--text);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
main{max-width:46rem;margin:2rem auto;padding:0 1rem}
h1{color:var(--accent);font-size:1.4rem;margin-top:0}
h2{font-size:1.1rem;margin-top:2rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
a{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.2rem 1.4rem;margin-bottom:1rem}
label{display:block;font-weight:600;margin:.9rem 0 .25rem}
.check label{display:inline;font-weight:600;margin-left:.4rem}
.check{margin:.9rem 0 .25rem}
input[type=text],input[type=password],input[type=number],input[type=time],select{width:100%;padding:.5rem .6rem;border-radius:6px;border:1px solid var(--line);background:#121418;color:var(--text);font:inherit}
.help{color:var(--muted);font-size:.85rem;margin-top:.2rem}
.btn{display:inline-block;padding:.55rem 1.1rem;border-radius:6px;border:0;background:var(--accent);color:#0d1b26;font-weight:700;cursor:pointer;text-decoration:none;font:inherit}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;gap:1rem}
.msg{border-radius:6px;padding:.6rem .8rem;margin-bottom:1rem}
.msg.ok{background:var(--okbg);border:1px solid var(--ok)}
.msg.err{background:var(--errbg);border:1px solid var(--err)}
table{width:100%;border-collapse:collapse}
td{padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}
td:first-child{color:var(--muted);width:40%;word-break:normal}
.steps{display:flex;gap:.3rem;margin-bottom:1rem}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
code{background:#23262e;border-radius:4px;padding:.1rem .3rem}
footer{max-width:46rem;margin:3rem auto 1rem;padding:0 1rem;color:#777;font-size:.8rem}
</style>
</head>
<body>
{% if page.show_nav %}
<header>
  <a class="brand" href="/">M3Usort</a>
  {% if page.is_admin %}
    <a href="/admin">Admin</a>
    <form method="post" action="/admin/logout" style="margin:0"><button type="submit">Log out</button></form>
  {% else %}
    <a href="/login">Admin login</a>
  {% endif %}
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
<footer>{{ page.version }}</footer>
</body>
</html>
