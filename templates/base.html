<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }}</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#16181d;--panel:#1e2128;--line:#2d313b;--text:#e6e6e6;--muted:#9aa0aa;--accent:#7cc4ff;--ok:#3d7a4a;--okbg:#1f3a24;--err:#a34848;--errbg:#3a1f1f}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.5}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;padding:.7rem 1.2rem;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;color:var(--accent);text-decoration:none;margin-right:auto}
header a,header button{color:var(--text);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}
main{max-width:46rem;margin:2rem auto;padding:0 1rem}
h1{color:var(--accent);font-size:1.4rem;margin-top:0}
h2{font-size:1.1rem;margin-top:2rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
a{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.2rem 1.4rem;margin-bottom:1rem}
label{display:block;font-weight:600;margin:.9rem 0 .25rem}
.check label{display:inline;font-weight:600;margin-left:.4rem}
.check{margin:.9rem 0 .25rem}
input[type=text],input[type=search],input[type=password],input[type=number],input[type=time],select{width:100%;padding:.5rem .6rem;border-radius:6px;border:1px solid var(--line);background:#121418;color:var(--text);font:inherit}
.help{color:var(--muted);font-size:.85rem;margin-top:.2rem}
.btn{display:inline-block;padding:.55rem 1.1rem;border-radius:6px;border:0;background:var(--accent);color:#0d1b26;font-weight:700;cursor:pointer;text-decoration:none;font:inherit}
.btn{white-space:nowrap}
td.act{width:1%;white-space:nowrap;word-break:normal}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;gap:1rem}
.msg{border-radius:6px;padding:.6rem .8rem;margin-bottom:1rem}
.msg.ok{background:var(--okbg);border:1px solid var(--ok)}
.msg.err{background:var(--errbg);border:1px solid var(--err)}
table{width:100%;border-collapse:collapse}
td{padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}
td:first-child{color:var(--muted);width:40%;word-break:normal}
.steps{display:flex;gap:.3rem;margin-bottom:1rem}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
code{background:#23262e;border-radius:4px;padding:.1rem .3rem}
footer{max-width:46rem;margin:3rem auto 1rem;padding:0 1rem;color:#777;font-size:.8rem}
main.wide,footer.wide{max-width:76rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem;margin-bottom:1rem}
.stat{border-radius:8px;padding:1rem 1.2rem;color:#fff}
.stat .n{font-size:1.8rem;font-weight:700} .stat .l{opacity:.85;font-size:.9rem}
.stat .plus{color:#b8f5c4;font-size:1rem;font-weight:600;margin-left:.3rem}
.s1{background:#2b5f8a}.s2{background:#6a3d8a}.s3{background:#2f6b4f}.s4{background:#8a5a2b}
.filters{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem}
.filters input[type=text]{flex:1 1 14rem;width:auto}.filters select{width:auto;flex:0 1 14rem}
.filters .check{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:1rem}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.tile .img{aspect-ratio:2/3;background:#0f1115;display:flex;align-items:center;justify-content:center;color:#555;font-size:.8rem;text-align:center;overflow:hidden}
.tile .img span{padding:.5rem}
.tile .img img{width:100%;height:100%;object-fit:cover;display:block}
.tile .meta{padding:.5rem .6rem;font-size:.85rem}
.tile .name{font-weight:600;line-height:1.25;word-break:break-word;color:var(--text);text-decoration:none;display:block}
.tile a.img{text-decoration:none}
.tile .sub{color:var(--muted);font-size:.75rem;margin-top:.2rem}
.tile .add{margin-top:.4rem;width:100%;padding:.35rem;font-size:.8rem}
.tile .have{margin-top:.4rem;font-size:.8rem;color:#8fd19e}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
@media (max-width:800px){.two{grid-template-columns:1fr}}
ul.sortable{list-style:none;padding:0;margin:.6rem 0}
ul.sortable li{display:flex;align-items:center;gap:.6rem;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
ul.sortable li .t{flex:1;word-break:break-word}
ul.sortable .ops button{background:#2a2e38;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:.1rem .45rem;margin-left:.2rem;cursor:pointer}
.detail{display:grid;grid-template-columns:16rem 1fr;gap:1.5rem;align-items:start}
.detail .poster{width:100%;border-radius:8px;background:#0f1115;aspect-ratio:2/3;object-fit:cover}
.detail .poster-box span{display:flex;aspect-ratio:2/3;align-items:center;justify-content:center;background:#0f1115;border-radius:8px;padding:1rem;text-align:center}
.detail .facts{color:var(--muted);margin:.3rem 0 1rem}
.badge{display:inline-block;border-radius:999px;padding:.1rem .6rem;font-size:.8rem;margin-right:.4rem}
.badge.on{background:#1f3a24;color:#8fd19e}.badge.off{background:#3a1f1f;color:#e0a0a0}
.cast{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.cast a{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.3rem .6rem;text-decoration:none;color:var(--text)}
.cast a .help{display:block}
@media (max-width:700px){.detail{grid-template-columns:1fr}.detail .poster-box{max-width:14rem}}
.pager{display:flex;gap:.5rem;justify-content:center;align-items:center;margin:1.5rem 0}
nav.tabs a{margin-right:1rem}
</style>
</head>
<body>
{% if page.show_nav %}
<header>
  <a class="brand" href="/"><img src="/favicon.png" alt="" width="22" height="22" style="vertical-align:-5px;margin-right:.4rem">M3Usort</a>
  <a href="/movies">Movies</a>
  <a href="/series">Series</a>
  <a href="/new">New</a>
  <a href="/library">Library</a>
  <a href="/playlist">Live TV</a>
  {% if page.is_admin %}
    <a href="/admin">Admin</a>
    <form method="post" action="/admin/logout" style="margin:0"><button type="submit">Log out</button></form>
  {% else %}
    <a href="/login">Admin login</a>
  {% endif %}
</header>
{% endif %}
<main{% block mainclass %}{% endblock %}>
{% block content %}{% endblock %}
</main>
<script>
function imgFail(img) {
  const fb = img.dataset.fallback;
  if (fb && img.src !== fb) { img.dataset.fallback = ''; img.src = fb; return; }
  const t = img.closest('.tile, .detail'); img.replaceWith(Object.assign(document.createElement('span'), {textContent: t ? t.title : ''}));
}
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('ul.sortable button[data-op]'); if (!b) return;
  const li = b.closest('li');
  if (b.dataset.op === 'up' && li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling);
  if (b.dataset.op === 'down' && li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li);
  if (b.dataset.op === 'del') li.remove();
});
document.addEventListener('submit', async (ev) => {
  const f = ev.target;
  if (!f.matches('form.add-form')) return;
  ev.preventDefault();
  const b = f.querySelector('button'); b.disabled = true; const label = b.textContent; b.textContent = 'Adding…';
  try {
    const r = await fetch(f.action, {method: 'POST', headers: {'Accept': 'application/json'}});
    const j = await r.json();
    b.textContent = j.ok ? 'Added ✓' : 'Failed'; b.title = j.message;
    if (!j.ok) { b.disabled = false; alert(j.message); }
  } catch (e) { b.textContent = label; b.disabled = false; alert('Request failed: ' + e); }
});
</script>
<footer{% block footclass %}{% endblock %}>{{ page.version }}</footer>
</body>
</html>
